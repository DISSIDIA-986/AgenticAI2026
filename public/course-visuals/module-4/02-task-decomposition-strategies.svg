  <rect x="104" y="796" width="1392" height="58" rx="18" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
  <text x="800" y="832" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#16345F">Sequential suits fixed paths. Hierarchical suits large structured goals. Adaptive suits open-ended tasks where the plan must evolve during execution.</text>
