<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FAF8F5"/>
  <rect x="0.5" y="0.5" width="1599" height="899" stroke="#E2E8F0"/>

  <text x="800" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="54" fill="#16345F">Sequential Pipeline vs Event-Driven Pipeline</text>
  <text x="800" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#475569">The tradeoff is not style. It is where branching, waiting, retries, and recovery are allowed to exist.</text>

  <defs>
    <marker id="arrow-left" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto">
      <path d="M2 2L14 8L2 14" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-right" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto">
      <path d="M2 2L14 8L2 14" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="84" y="210" width="608" height="538" rx="30" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="4"/>
  <text x="388" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#16345F">Sequential Pipeline</text>
  <text x="388" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#475569">best when the path is fixed and deterministic</text>

  <rect x="124" y="390" width="110" height="88" rx="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="4"/>
  <rect x="268" y="390" width="110" height="88" rx="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="4"/>
  <rect x="412" y="390" width="110" height="88" rx="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="4"/>
  <rect x="556" y="390" width="110" height="88" rx="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="4"/>
  <text x="179" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#16345F">Input</text>
  <text x="323" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#16345F">Step 1</text>
  <text x="467" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#16345F">Step 2</text>
  <text x="611" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#16345F">Output</text>
  <path d="M234 434H268" stroke="#2563EB" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-left)"/>
  <path d="M378 434H412" stroke="#2563EB" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-left)"/>
  <path d="M522 434H556" stroke="#2563EB" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-left)"/>

  <text x="388" y="566" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#16345F">Strengths</text>
  <text x="388" y="608" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#475569">simple</text>
  <text x="388" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#475569">predictable</text>
  <text x="388" y="676" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#475569">easy to debug</text>
  <text x="388" y="724" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#16345F">ETL, document generation, deterministic workflows</text>

  <rect x="908" y="210" width="608" height="538" rx="30" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="4"/>
  <text x="1212" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#16345F">Event-Driven Pipeline</text>
  <text x="1212" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#475569">best when routing, waiting, and branching are first-class</text>

  <rect x="946" y="390" width="100" height="88" rx="22" fill="#D1FAE5" stroke="#16A34A" stroke-width="4"/>
  <rect x="1080" y="390" width="100" height="88" rx="22" fill="#D1FAE5" stroke="#16A34A" stroke-width="4"/>
  <rect x="1214" y="390" width="100" height="88" rx="22" fill="#D1FAE5" stroke="#16A34A" stroke-width="4"/>
  <rect x="1348" y="390" width="130" height="88" rx="22" fill="#FDE4C7" stroke="#EA580C" stroke-width="4"/>
  <text x="996" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#16345F">Event</text>
  <text x="1130" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#16345F">Router</text>
  <text x="1264" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#16345F">Handlers</text>
  <text x="1413" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#16345F">Aggregator</text>
  <path d="M1046 434H1080" stroke="#16A34A" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-right)"/>
  <path d="M1180 434H1214" stroke="#16A34A" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-right)"/>
  <path d="M1314 434H1348" stroke="#16A34A" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-right)"/>

  <path d="M1130 390V348H1264V390" stroke="#16A34A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1198" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#166534">branch</text>
  <path d="M1264 478V528H1130V478" stroke="#16A34A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1198" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#166534">retry / resume</text>

  <text x="1212" y="596" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#16345F">Strengths</text>
  <text x="1212" y="638" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#475569">flexible routing</text>
  <text x="1212" y="672" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#475569">parallel work</text>
  <text x="1212" y="706" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#475569">pause and recovery</text>
  <text x="1212" y="754" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#16345F">chat systems, approvals, long-running workflows</text>

  <rect x="738" y="346" width="124" height="262" rx="28" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>
  <text x="800" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#9A3412">Branch</text>
  <text x="800" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#9A3412">Wait</text>
  <text x="800" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#9A3412">Retry</text>
  <text x="800" y="588" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#9A3412">Recover</text>

  <rect x="94" y="792" width="1412" height="58" rx="18" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
  <text x="800" y="828" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#16345F">If the workflow becomes dynamic, the linear chain starts fighting the problem. That is when event-driven orchestration starts paying for itself.</text>
</svg>
