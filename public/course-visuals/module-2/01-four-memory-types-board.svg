<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FAF8F5"/>
  <rect x="0.5" y="0.5" width="1599" height="899" stroke="#E2E8F0"/>

  <text x="800" y="94" text-anchor="middle" font-family="Georgia, serif" font-size="54" fill="#16345F">Four Memory Types</text>

  <rect x="175" y="175" width="1250" height="580" rx="30" fill="none" stroke="#94A3B8" stroke-width="4"/>

  <rect x="255" y="260" width="300" height="190" rx="24" fill="#2563EB"/>
  <text x="405" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#F8FAFC">Working Memory</text>
  <text x="405" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#DBEAFE">in-context</text>
  <text x="405" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#DBEAFE">fast but limited</text>

  <rect x="1045" y="260" width="300" height="190" rx="24" fill="#3B82F6"/>
  <text x="1195" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#F8FAFC">Long-term Memory</text>
  <text x="1195" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#DBEAFE">vector DB</text>
  <text x="1195" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#DBEAFE">retrieval based</text>

  <rect x="255" y="490" width="300" height="190" rx="24" fill="#0EA5E9"/>
  <text x="405" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#F8FAFC">Episodic Memory</text>
  <text x="405" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#E0F2FE">task snapshots</text>
  <text x="405" y="635" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#E0F2FE">and lessons</text>

  <rect x="1045" y="490" width="300" height="190" rx="24" fill="#16A34A"/>
  <text x="1195" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#F8FAFC">Semantic Cache</text>
  <text x="1195" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#DCFCE7">reuse similar</text>
  <text x="1195" y="635" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#DCFCE7">queries</text>

  <circle cx="800" cy="470" r="128" fill="#E2E8F0" stroke="#94A3B8" stroke-width="4"/>
